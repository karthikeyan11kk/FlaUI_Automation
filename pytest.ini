[pytest]
# Lets the tests import the "acturis" package from the project folder
pythonpath = .
testpaths = tests
# -v: one line per test | --tb=short: short error output (also keeps the password out of reports)
# --html: report with every test's result in results/report.html
addopts = -v --tb=short --html=results/report.html --self-contained-html

# Live log in the console: each step with the seconds it took to find the element
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s  %(message)s
log_cli_date_format = %H:%M:%S
